houses.forEach((h,i)=>{Object.assign(h,{size:[68,84,32][i],start:'2025-03-01',end:'2027-02-28',currency:'EUR',due:obligations[i].rent.due,deadline:20,types:obligations[i].bills.map(b=>b.name)});versions[i]=[{...h,from:'2025-12'}];ledger[i]={};contracts[i]=sample('Ugovor o zakupu');for(let k='2025-12';k<=nowKey;k=shift(k,1)){let p=period(i,k),r=p.rent;r.confirmed=k<nowKey||i===0;r.reported=r.confirmed;r.proof=sample(r.confirmed?'Potvrda kirije':'');p.bills.forEach((b,j)=>{let base=obligations[i].bills[j];b.amount=([4120,8420,4150][i]+j*2160)+(Number(k.slice(5))-10)*30;b.bill=sample(b.name+' · '+label(k));b.proof=sample('Uplatnica · '+label(k));if(i===0&&k==='2026-06'&&!j)b.proof=[];if(i===1&&k==='2026-10'){b.due=base.due;b.previousDebt=base.previousDebt||0;if(!base.proof)b.proof=[];if(!base.bill){b.bill=[];b.amount=null}}if(i===2&&k==='2026-09'){b.proof=[];b.proofException={reason:'Dogovor sa zakupcem',actor:'Milan Petrović',date:'20.10.2026.'}}});if(k===nowKey)p.bills.forEach(b=>{b.bill=[];b.proof=[];b.amount=null})}});
const last=a=>a[a.length-1],valid=a=>!!last(a)&&!last(a).rejected;
const closed=(b,f)=>valid(b[f])||!!b[f+'Exception'];
const info=(tone,title,sub='')=>({tone,title,sub});
const overdue=(k,d)=>k<nowKey||(k===nowKey&&d<18);
function rentInfo(i,k=key()){let r=period(i,k)?.rent;if(!r)return info('gray','Nema obaveze');if(r.confirmed)return info('green','Primljena',money(r.amount,r.currency));if(r.exception)return info('green','Odobreno po dogovoru');if(r.reported)return info('yellow','Čeka potvrdu');return overdue(k,r.due)?info('red','Kasni'):info('yellow','Nije dospela')}
function billInfo(i,k=shift(key(),-1)){let bs=period(i,k)?.bills||[];if(!bs.length)return info('gray','Nema obaveznih računa');let missing=bs.filter(b=>!closed(b,'bill')||!closed(b,'proof'));if(!missing.length)return info('green',bs.some(b=>b.billException||b.proofException)?'Odobreno po dogovoru':'Sve dostavljeno',label(k));return info(missing.some(b=>overdue(shift(k,1),b.due))?'red':'yellow','Nedostaje dokument',missing.map(b=>b.name).join(', '))}
function history(i){let issues=[];Object.keys(ledger[i]).sort().forEach(k=>{let p=ledger[i][k];if(k<key()&&overdue(k,p.rent.due)&&!p.rent.confirmed&&!p.rent.exception)issues.push([k,'rent','Kirija · '+label(k)+' · Čeka prijem']);if(k<shift(key(),-1))p.bills.forEach((b,j)=>['bill','proof'].forEach(f=>{if(!closed(b,f)&&overdue(shift(k,1),b.due))issues.push([shift(k,1),j+'-'+f,b.name+' · '+label(k)+' · '+(f==='bill'?'Nedostaje račun':'Nedostaje dokaz o uplati')])}))});return issues}

function dash(){let total=0,got=0;houses.forEach((_,i)=>{let r=period(i,key())?.rent;if(r){let v=r.amount/(r.currency==='RSD'?117.2:1);total+=v;if(r.confirmed)got+=v}});return '<section class="home">'+heading('Moje nekretnine','',btn('＋ Dodaj nekretninu','add','class="btn"'))+months()+'<div class="totals">'+[['Očekivana kirija',total],['Primljeno',got],['Preostalo',total-got]].map(([n,v])=>'<div><small>'+n+'</small><b>'+money(v)+'</b></div>').join('')+'</div><div class="home-cards">'+houses.map((h,i)=>'<article class="home-property">'+identity(i,'details')+'<div class="home-tile-row">'+tile('Kirija',rentInfo(i),'rent',i)+tile('Računi',billInfo(i),'bills',i)+'</div>'+warning(i)+'</article>').join('')+'</div><p class="proof-note">Računi se odnose na prethodni mesec. Demo kurs: 1 EUR = 117,20 RSD.</p></section>'}

const card=html=>'<section class="card">'+html+'</section>';
const badge=x=>'<span class="status status-'+x.tone+'">'+esc(x.title)+'</span>';
function list(billing){return heading(billing?'Kirija i računi':'Detalji nekretnina','')+(billing?months():'')+houses.map((h,i)=>card(identity(i,billing?'account':'details',billing?'':' · '+h.size+' m² · '+money(h.rent,h.currency))+(billing?'<div class="tools">Kirija '+badge(rentInfo(i))+' Računi '+badge(billInfo(i))+'</div>':''))).join('')}
function utilityAverages(i) {
  const through = shift(nowKey, -1);
  const since = shift(through, -11);
  const types = new Map();
  const completeMonths = [];
  let mixed = false;
  for (let month = since; month <= through; month = shift(month, 1)) {
    const bills = ledger[i][month]?.bills || [];
    const monthly = new Map();
    for (const bill of bills) {
      if (!types.has(bill.name)) types.set(bill.name, []);
      if (!monthly.has(bill.name)) monthly.set(bill.name, []);
      monthly.get(bill.name).push(bill);
    }
    const known = b => valid(b.bill) && Number.isFinite(b.amount) && ['EUR','RSD'].includes(b.currency);
    for (const [name, items] of monthly) {
      if (items.every(known)) types.get(name).push(items);
    }
    if (bills.length && bills.every(known)) completeMonths.push(bills);
  }
  function row(name, months) {
    const bills = months.flat();
    const currencies = new Set(bills.map(b => b.currency));
    const currency = currencies.size === 1 ? bills[0].currency : 'RSD';
    if (currencies.size > 1) mixed = true;
    const total = bills.reduce((sum,b) => sum + b.amount * (b.currency === currency ? 1 : 117.2), 0);
    return '<tr><th scope="row">'+esc(name)+'</th><td>'+(months.length ? money(total/months.length,currency) : '—')+'</td><td>'+months.length+' / 12</td></tr>';
  }
  const rows = Array.from(types, ([name,months]) => row(name, months)).join('');
  const combined = row('Ukupno mesečno', completeMonths);
  return card('<h3>Prosečni mesečni računi</h3><p>'+label(since)+' — '+label(through)+'</p><table class="averages"><thead><tr><th>Račun</th><th>Prosek</th><th>Meseci</th></tr></thead><tbody>'+rows+'</tbody><tfoot>'+combined+'</tfoot></table><p>Za svaki tip računa koriste se meseci sa evidentiranim iznosom i važećim računom. Ukupni prosek obuhvata mesece sa svim iznosima.</p>'+(mixed?'<small>Demo kurs za zbir različitih valuta: 1 EUR = 117,20 RSD.</small>':''));
}
function details(){let i=selectedHouse,h=houses[i],sums={},annual={};for(const [k,p] of Object.entries(ledger[i])){let r=p.rent;if(r.confirmed){sums[r.currency]=(sums[r.currency]||0)+r.amount;if((r.receivedOn||k).startsWith('2026'))annual[r.currency]=(annual[r.currency]||0)+r.amount}}let fmt=o=>Object.entries(o).map(([c,v])=>money(v,c)).join(' + ')||'0';return '<div class="tools">'+btn('← Sve nekretnine','list')+btn('‹','houseprev','aria-label="Prethodna nekretnina"')+btn('›','housenext','aria-label="Sledeća nekretnina"')+'</div>'+heading(esc(h.name),esc(h.address),btn('Izmeni','edit'))+'<img class="hero" src="'+photos[i%3]+'" alt="Enterijer">'+card('<h3>Podaci o zakupu</h3><p>'+esc(h.tenant||'Nije izdato')+' · '+h.size+' m² · '+money(h.rent,h.currency)+'</p>Ugovor: '+esc(h.start)+' — '+esc(h.end)+docField('contract','Ugovor o zakupu',contracts[i]))+card('<h3>Primljena kirija</h3><p>Ukupno: '+fmt(sums)+'</p>U 2026. godini: '+fmt(annual))+utilityAverages(i)}
const owner=()=>view==='owner',id=()=>owner()?selectedHouse:tenantId;
function resolve(ref){if(ref==='contract')return [contracts[id()],null];if(ref==='rent')return [period(id(),key()).rent.proof,period(id(),key()).rent];let [j,f]=ref.split('-'),b=period(id(),shift(key(),-1)).bills[j];return [b[f],b]}
function logText(x){return esc([x.actor,x.date,x.reason,x.comment].filter(Boolean).join(' · '))}
function docField(ref,title,docs){let d=last(docs),a='data-ref="'+ref+'"',field=ref.split('-')[1],ex=field&&resolve(ref)[1][field+'Exception'];let upload=(!owner()||ref==='contract')&&!ex;
return '<div class="docfield '+(field&&!ex&&!valid(docs)&&overdue(key(),resolve(ref)[1].due)?'doc-overdue':'')+'" id="item-'+ref+'"><strong>'+title+'</strong><p>'+(ex?'Odobreno po dogovoru · '+logText(ex):d?(d.rejected?'Odbijeno · '+logText(d.rejected):'Dostavljeno'):'Nije dostavljeno')+'</p><div class="tools">'+(d?btn('Otvori dokument','open',a):'')+(upload?'<label class="filepick">'+(d?'Zameni dokument':'Priloži dokument')+'<input type="file" accept="image/*,application/pdf" '+a+'></label>':'')+(owner()&&ref!=='contract'&&!ex?(valid(docs)?btn('Odbij dokument','reject',a):field?btn('Odobri izuzetak','except',a):''):'')+'</div>'+(docs.length?'<details><summary>Istorija dokumenta ('+docs.length+')</summary>'+docs.map((v,n)=>'<p>'+btn(esc(v.name),'open',a+' data-n="'+n+'"')+' · '+logText(v)+(v.rejected?' · Odbijeno: '+logText(v.rejected):'')+'</p>').join('')+'</details>':'')+'</div>'}
function account(){if(!owner()&&tenantId<0)return heading('Moj stan','Nema aktivnog zakupca.');let i=id(),h=houses[i],k=key(),bk=shift(k,-1),r=period(i,k)?.rent,bs=period(i,bk)?.bills||[],xs=history(i),notes=new Set();let ri=rentInfo(i);if(r&&!r.confirmed&&!r.exception)notes.add(ri.title==='Kasni'?'Rok za kiriju je prošao.':r.reported?'Uplata čeka potvrdu vlasnika.':'Rok za kiriju je '+r.due+'. u mesecu.');if(bs.some(b=>!closed(b,'bill')||!closed(b,'proof')))notes.add('Nedostaje dokumentacija za komunalije.');if(bs.some(b=>[b.bill,b.proof].some(a=>last(a)?.rejected))||last(r?.proof||[])?.rejected)notes.add('Odbijeni dokument treba zameniti.');if(xs.length)notes.add('Postoje nerešene obaveze iz ranijih meseci.');
return (owner()?btn('← Sve nekretnine','overview'):'<label>Demo zakupac <select id="tenant-choice">'+houses.map((h,n)=>h.tenant?'<option value="'+n+'" '+(n===i?'selected':'')+'>'+esc(h.tenant)+'</option>':'').join('')+'</select></label>')+heading(owner()?h.name&&esc(h.name):'Moj stan',esc(h.name)+' · '+esc(h.address))+months()+(notes.size?'<details><summary>Obaveštenja ('+notes.size+')</summary>'+Array.from(notes,n=>'<p>'+n+'</p>').join('')+'</details>':'')+card('<div id="rent-section"><h2>Kirija</h2>'+badge(ri)+(r?'<p>'+money(r.amount,r.currency)+' · Rok '+r.due+'. '+label(k)+'</p><p>'+(r.reported?'Zakupac je prijavio uplatu.':'Uplata nije prijavljena.')+'</p>'+docField('rent','Dokaz uplate kirije',r.proof)+(r.exception?logText(r.exception):'')+(!r.confirmed&&!r.exception?(owner()?btn('Potvrdi prijem kirije','confirm')+' '+btn('Odobri izuzetak','except','data-ref="rent"'):!r.reported?btn('Prijavi uplatu','report'):''):''):'')+'</div>')+'<h2 id="bill-section">Računi · '+label(bk)+'</h2>'+(bs.length?bs.map((b,j)=>card('<h3>'+esc(b.name)+'</h3><p>Rok '+b.due+'. '+label(k)+' · '+(b.amount==null?'Iznos nije evidentiran':money(b.amount,b.currency))+'</p>'+badge(closed(b,'bill')&&closed(b,'proof')?info('green',b.billException||b.proofException?'Odobreno po dogovoru':'Dokumentacija potpuna'):info(overdue(k,b.due)?'red':'yellow',!closed(b,'proof')&&closed(b,'bill')?'Nedostaje dokaz o uplati':'Dokumentacija nepotpuna'))+(b.previousDebt!=null?'<p class="'+(b.previousDebt>0?'warn':'')+'">Prethodni dug: '+money(b.previousDebt,b.currency)+'</p>':'')+btn('Unesi iznose','amount','data-j="'+j+'"')+'<div class="docpair">'+docField(j+'-bill','Račun',b.bill)+docField(j+'-proof','Dokaz uplate',b.proof)+'</div>')).join(''):'<p>Nema obaveznih računa za ovaj period.</p>')+card('<h3>Nerešene obaveze iz prethodnih meseci</h3>'+(xs.map(x=>jump(i,x,esc(x[2]))).join('')||'<p>Nema nerešenih obaveza.</p>'))}
function render(){let el=document.querySelector('#page');el.classList.toggle('sheet',page!=='dashboard');el.innerHTML=page==='dashboard'?dash():page==='properties'?list(false):page==='details'?details():page==='bills'?list(true):account();document.querySelector('#crumb').textContent=({dashboard:'Moje nekretnine',properties:'Detalji nekretnina',details:'Detalji nekretnine',bills:'Kirija i računi',account:'Kirija i računi',tenant:'Portal zakupca'})[page];document.querySelectorAll('nav [data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===({details:'properties',account:'bills'}[page]||page)));document.querySelectorAll('[data-view]').forEach(b=>b.classList.toggle('on',b.dataset.view===view))}

function dialog(title,body,save){const host=document.querySelector('#modal');modalAction=save;host.innerHTML='<div class="modalbg"><form class="modal" role="dialog" aria-modal="true" aria-label="'+esc(title)+'"><h2>'+esc(title)+'</h2>'+body+'<div class="tools">'+(save?'<button class="primary">Potvrdi</button>':'')+btn('Zatvori','close')+'</div></form></div>';host.querySelector('input,select,button')?.focus()}

const input=(title,name,v='',type='text',attrs='')=>'<label>'+title+'<input name="'+name+'" type="'+type+'" value="'+esc(v)+'" '+attrs+'></label>';
function setup(edit){let h=edit?houses[selectedHouse]:{name:'',address:'',size:'',tenant:'',rent:'',currency:'EUR',start:'2026-11-01',end:'2027-10-31',due:5,deadline:20,types:[]};let types=[...new Set([...common,...h.types])];dialog(edit?'Izmeni nekretninu':'Dodaj nekretninu',input('Naziv','name',h.name,'text','required')+input('Adresa','address',h.address,'text','required')+input('Površina (m²)','size',h.size,'number','required min=".1" step=".1"')+input('Zakupac (prazno ako nije izdato)','tenant',h.tenant)+input('Mesečna kirija','rent',h.rent,'number','required min="0" step=".01"')+'<label>Valuta<select name="currency">'+['EUR','RSD'].map(c=>'<option '+(c===h.currency?'selected':'')+'>'+c+'</option>')+'</select></label>'+input('Početak ugovora','start',h.start,'date','required')+input('Kraj ugovora','end',h.end,'date','required')+input('Dan dospeća kirije','due',h.due,'number','min="1" max="28" required')+input('Rok za dokumentaciju (dan narednog meseca)','deadline',h.deadline,'number','min="1" max="28" required')+'<p>Obavezni računi</p><div class="checks">'+types.map(t=>'<label><input type="checkbox" name="types" value="'+esc(t)+'" '+(h.types.includes(t)?'checked':'')+'>'+esc(t)+'</label>').join('')+'</div>'+input('Dodatni tip računa','custom')+'<p>Izmene obaveza važe od '+label(edit?shift(nowKey,1):nowKey)+'</p>',f=>{let v=Object.fromEntries(f);if(v.end<v.start)throw Error('Kraj ugovora mora biti posle početka.');if(!v.name.trim()||!v.address.trim())throw Error('Unesite naziv i adresu.');v.tenant=v.tenant.trim();v.types=[...new Set([...f.getAll('types'),v.custom.trim()].filter(Boolean))];for(let n of ['rent','size','due','deadline'])v[n]=Number(v[n]);let i=edit?selectedHouse:houses.length;if(!edit){ledger[i]={};versions[i]=[];contracts[i]=[]}houses[i]=v;let from=edit?shift(nowKey,1):nowKey;versions[i]=versions[i].filter(x=>x.from!==from);versions[i].push({...v,from});Object.keys(ledger[i]).filter(k=>k>=from).forEach(k=>{let p=ledger[i][k];if(!p.rent.reported&&!p.rent.confirmed&&!p.rent.exception&&!p.rent.proof.length&&!p.bills.some(b=>b.bill.length||b.proof.length||b.billException||b.proofException||b.amount!=null))delete ledger[i][k]});selectedHouse=i;page='details'})}
function audit(f){return {actor:'Milan Petrović',date:stamp(),reason:f.get('reason'),comment:f.get('comment')}}
function showDoc(ref,n){let docs=resolve(ref)[0],d=docs[n??docs.length-1];let src=d.url;dialog(d.name,'<div class="viewer">'+(src?(d.type==='application/pdf'?'<iframe title="PDF dokument" src="'+src+'"></iframe>':'<img alt="Priloženi dokument" src="'+src+'">'):'<h3>'+esc(d.name)+'</h3><p>Demonstracioni primer dokumenta</p><p>'+esc(houses[id()].name)+'</p>')+'</div>'+(src?'<a href="'+src+'" target="_blank" rel="noopener">Otvori original</a> '+(d.type!=='application/pdf'?btn('Uvećaj / umanji','zoom'):''):'')+(d.rejected?'<p>Odbijeno · '+logText(d.rejected)+'</p>':''))}
function scrollTarget(s){document.getElementById(s)?.scrollIntoView({block:'center'})}
document.addEventListener('click',e=>{let b=e.target.closest('button');if(!b)return;let d=b.dataset,a=d.act;if(d.view){view=d.view;if(!owner()&&!houses[tenantId]?.tenant)tenantId=houses.findIndex(h=>h.tenant);go(owner()?'dashboard':'tenant');return}if(d.page){if(d.house!=null)selectedHouse=+d.house;view=d.page==='tenant'?'tenant':'owner';go(d.obligation?'account':d.page);if(d.obligation)scrollTarget(d.obligation==='rent'?'rent-section':'bill-section');return}if(a==='prev'||a==='next'){setMonth(shift(key(),a==='prev'?-1:1));render()}if(a==='list')go('properties');if(a==='overview')go('bills');if(a==='houseprev'||a==='housenext'){selectedHouse=(selectedHouse+houses.length+(a==='houseprev'?-1:1))%houses.length;go('details')}if(a==='jump'){selectedHouse=+d.i;setMonth(d.k);go(owner()?'account':'tenant');scrollTarget(d.focus==='rent'?'rent-section':'item-'+d.focus)}if(a==='close')close();if(a==='zoom')document.querySelector('.viewer').classList.toggle('zoom');if(a==='open')showDoc(d.ref,d.n);if(owner()&&(a==='edit'||a==='add'))setup(a==='edit');if(a==='report'&&!owner()){period(id(),key()).rent.reported=true;render()}if(a==='confirm'&&owner())dialog('Potvrdi prijem kirije','<p>Potvrđujete da ste primili '+money(period(id(),key()).rent.amount,period(id(),key()).rent.currency)+'?</p>',()=>{let r=period(id(),key()).rent;r.confirmed=true;r.receivedOn=nowKey});if((a==='except'||a==='reject')&&owner()){let [docs,obj]=resolve(d.ref);dialog(a==='except'?'Odobri izuzetak':'Odbij dokument','<label>Razlog<select name="reason">'+(a==='except'?['Dogovor sa zakupcem','Dokaz dostavljen drugim putem','Drugo']:reasonList).map(t=>'<option>'+t+'</option>').join('')+'</select></label>'+input('Komentar (opciono)','comment'),f=>{if(a==='reject')last(docs).rejected=audit(f);else obj[d.ref==='rent'?'exception':d.ref.split('-')[1]+'Exception']=audit(f)})}if(a==='amount'){let obj=period(id(),shift(key(),-1)).bills[d.j];dialog('Iznosi sa računa',input('Iznos','amount',obj.amount??'','number','min="0" step=".01" required')+'<label>Valuta<select name="currency">'+['RSD','EUR'].map(c=>'<option '+(c===obj.currency?'selected':'')+'>'+c+'</option>').join('')+'</select></label>'+input('Prethodni dug (prazno ako nije naveden)','debt',obj.previousDebt??'','number','min="0" step=".01"'),f=>{obj.amount=+f.get('amount');obj.currency=f.get('currency');obj.previousDebt=f.get('debt')===''?null:+f.get('debt')})}});
document.addEventListener('submit',e=>{if(!e.target.matches('.modal'))return;e.preventDefault();try{modalAction?.(new FormData(e.target));close();render()}catch(err){alert(err.message)}});
document.addEventListener('change',e=>{let t=e.target;if(t.id==='tenant-choice'){tenantId=+t.value;render()}if(t.type==='file'&&t.files[0]){let f=t.files[0];if(!/^image\//.test(f.type)&&f.type!=='application/pdf'){alert('Izaberite sliku ili PDF.');return}let docs=resolve(t.dataset.ref)[0];docs.push({name:f.name,type:f.type,url:URL.createObjectURL(f),date:stamp(),actor:owner()?'Vlasnik':houses[id()].tenant});render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});let startTouch;document.addEventListener('touchstart',e=>{startTouch=page==='details'&&!document.querySelector('.modal')&&e.touches.length===1?[e.touches[0].clientX,e.touches[0].clientY]:null},{passive:true});document.addEventListener('touchend',e=>{if(!startTouch)return;let t=e.changedTouches[0],dx=t.clientX-startTouch[0],dy=t.clientY-startTouch[1];startTouch=null;if(Math.abs(dx)>70&&Math.abs(dx)>2*Math.abs(dy)){selectedHouse=(selectedHouse+houses.length+(dx<0?1:-1))%houses.length;go('details')}},{passive:true});
