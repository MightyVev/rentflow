<!doctype html><html lang="sr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Rental Property App</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f7f5;color:#1c2922;font:14px 'DM Sans',Arial,sans-serif}button,input,select{font:inherit}button{cursor:pointer}.shell{display:flex;min-height:100vh}.side{width:230px;background:#fff;border-right:1px solid #e6ece7;padding:25px 14px;position:fixed;inset:0 auto 0 0;display:flex;flex-direction:column}.logo{font-size:17px;font-weight:800;padding:8px 10px 35px;color:#205e40}.logo b{background:#205e40;color:white;border-radius:9px;padding:8px;margin-right:8px}.nav button{display:block;width:100%;border:0;background:none;text-align:left;padding:12px;border-radius:9px;color:#596b60;font-weight:600}.nav button.active,.nav button:hover{background:#eaf4ec;color:#1d6947}.nav small{display:block;color:#9aa69e;font-size:10px;letter-spacing:1px;padding:12px}.sidefoot{margin-top:auto;padding:12px;color:#6c7a71;font-size:11px;border-top:1px solid #e6ece7}.main{margin-left:230px;width:calc(100% - 230px)}.top{height:68px;background:#ffffffdd;border-bottom:1px solid #e6ece7;display:flex;align-items:center;justify-content:space-between;padding:0 30px;position:sticky;top:0}.switch{background:#eff3ef;padding:4px;border-radius:8px}.switch button{border:0;background:none;padding:8px 12px;border-radius:6px;color:#66766b;font-weight:700;font-size:11px}.switch button.on{background:white;color:#205e40}.content{max-width:1200px;margin:auto;padding:30px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.head h1{font-size:26px;margin:0 0 7px}.head p{margin:0;color:#78867d}.btn{background:#1d6947;color:white;border:0;border-radius:8px;padding:11px 14px;font-weight:700}.btn.secondary{background:white;color:#1d6947;border:1px solid #e0e8e1}.grid{display:grid;gap:15px}.stats{grid-template-columns:repeat(4,1fr)}.card{background:white;border:1px solid #e6ece7;border-radius:13px;padding:18px;box-shadow:0 7px 20px #1d39250a}.label{color:#7b8980;font-size:11px}.value{font-size:23px;font-weight:800;margin:12px 0 5px}.hint{font-size:10px;color:#77857c}.cols{grid-template-columns:1.4fr 1fr;margin-top:16px}.title{font-weight:800;margin:0 0 15px}.line{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid #eef1ee;font-size:12px}.line:last-child{border:0}.muted{color:#77857c;font-size:10px}.tag{border-radius:15px;background:#fff2dc;color:#98611d;padding:5px 8px;font-size:9px;font-weight:bold}.bad{background:#fff0ee;color:#ad5048}.good{background:#eaf4ec;color:#1d6947}.props{grid-template-columns:repeat(3,1fr)}.property{padding:0;overflow:hidden}.art{height:110px;background:linear-gradient(120deg,#dce9df,#a4c4ac);display:grid;place-items:center;font-size:42px}.body{padding:15px}.body h3{margin:0 0 5px}.body p{margin:0;color:#77857c;font-size:11px}.row{display:flex;justify-content:space-between;margin-top:15px;padding-top:12px;border-top:1px solid #eef1ee;font-size:11px}.link{border:0;background:none;color:#1d6947;font-weight:bold}.alert{padding:13px;background:#fff0ee;color:#9f4d44;border-radius:10px;margin-bottom:13px;font-size:11px}.alert b{display:block;margin-bottom:5px}.split{grid-template-columns:1fr 1fr}.upload{border:1px dashed #b4c5b9;padding:22px;text-align:center;border-radius:10px;background:#f9fbf9}.upload input{display:none}.upload label{display:inline-block;padding:8px 10px;background:#eaf4ec;border-radius:7px;color:#1d6947;font-weight:bold;cursor:pointer}.warn{background:#fff4df;color:#926223;padding:13px;border-radius:10px;margin-bottom:12px;font-size:11px}.balance{display:flex;gap:10px}.balance div{flex:1;padding:12px;background:#f5f8f5;border-radius:9px;font-size:10px}.balance b{display:block;font-size:13px;margin-top:6px}.modalbg{position:fixed;inset:0;background:#182a2088;display:grid;place-items:center;padding:20px}.modal{background:white;border-radius:14px;width:min(450px,100%);padding:20px}.modal input,.modal select{width:100%;padding:10px;border:1px solid #dce5dd;border-radius:7px;margin:5px 0 12px}.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#20392b;color:white;padding:12px;border-radius:8px}@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.props{grid-template-columns:repeat(2,1fr)}.cols,.split{grid-template-columns:1fr}}@media(max-width:600px){.side{width:58px;padding:12px 5px}.logo{font-size:0;padding:8px 4px 24px}.logo b{font-size:15px}.nav small{display:none}.nav button{font-size:0;text-align:center;padding:13px 3px}.nav button:first-letter{font-size:18px}.sidefoot{font-size:0;padding:8px 2px}.main{margin-left:58px;width:calc(100% - 58px)}.top{padding:0 12px;height:60px}.content{padding:20px 12px}.head h1{font-size:21px}.head p{font-size:11px}.head .btn{padding:9px;font-size:10px}.stats{gap:8px}.card{padding:13px}.value{font-size:18px}.props{grid-template-columns:1fr}.switch button{padding:7px;font-size:9px}}
/* Responsive layout: retain desktop, reserve space for mobile navigation. */
.main{min-width:0}.top{gap:12px;z-index:10}.switch{display:flex;flex-shrink:0}.grid>*{min-width:0}.line,.row{gap:10px;flex-wrap:wrap}.line>*{min-width:0;overflow-wrap:anywhere}.modalbg{z-index:40;overflow-y:auto}.modal{max-height:calc(100dvh - 40px);overflow-y:auto}.toast{z-index:50;max-width:calc(100% - 24px);width:max-content}.mobile-nav{display:none}button,.upload label{min-height:44px}.noscript{padding:20px;background:#fff4df;color:#543b15}
@media(max-width:600px){
.side{display:none}.shell{display:block}.main{margin-left:0;width:100%}.top{height:auto;min-height:64px;padding:10px 12px;flex-wrap:wrap}.top #crumb{font-size:14px;font-weight:700;flex:1;min-width:0}.switch button{font-size:12px;padding:8px 10px}.content{padding:20px 16px calc(96px + env(safe-area-inset-bottom,0px))}.head{gap:12px;align-items:flex-start;flex-wrap:wrap}.head h1{font-size:23px}.head p{font-size:14px}.head .btn{font-size:14px;padding:10px 12px}.stats,.cols,.split,.props{grid-template-columns:minmax(0,1fr)}.card{padding:16px}.property{padding:0}.label,.hint,.muted,.body p,.row,.line,.alert,.warn{font-size:13px}.tag{font-size:11px}.value{font-size:24px}.modal input,.modal select{font-size:16px}.modalbg{padding:12px}.modal{max-height:calc(100dvh - 24px)}.mobile-nav{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));position:fixed;bottom:0;left:0;right:0;z-index:20;background:white;border-top:1px solid #dce5dd;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}.mobile-nav button{border:0;background:white;color:#596b60;padding:6px 2px;font-size:10px;min-width:0;min-height:56px;border-radius:8px}.mobile-nav button span{display:block;font-size:20px;margin-bottom:4px}.mobile-nav button.active{background:#eaf4ec;color:#1d6947;font-weight:bold}.toast{bottom:calc(86px + env(safe-area-inset-bottom,0px))}
}
</style></head><body><div class="shell"><aside class="side"><div class="logo"><b>⌂</b>RentFlow</div><nav class="nav"><small>GLAVNI MENI</small><button data-page="dashboard">▦　Pregled</button><button data-page="properties">⌂　Moje nekretnine</button><button data-page="details">▤　Detalji nekretnine</button><button data-page="bills">▧　Kirija i računi</button><button data-page="tenant">♙　Portal zakupca</button></nav><div class="sidefoot">Besplatan paket<br><b>Milan Petrović · Vlasnik</b></div></aside><main class="main"><header class="top"><span id="crumb">Pregled</span><div class="switch"><button class="on" data-view="owner">Vlasnik</button><button data-view="tenant">Zakupac</button></div></header><div class="content" id="page"></div></main></div><nav class="mobile-nav" aria-label="Glavna navigacija"><button data-page="dashboard"><span aria-hidden="true">▦</span>Pregled</button><button data-page="properties"><span aria-hidden="true">⌂</span>Nekretnine</button><button data-page="details"><span aria-hidden="true">▤</span>Detalji</button><button data-page="bills"><span aria-hidden="true">▧</span>Kirija i računi</button><button data-page="tenant"><span aria-hidden="true">♙</span>Zakupac</button></nav><noscript><div class="noscript">Za prikaz RentFlow aplikacije potreban je JavaScript. Otvorite aplikaciju preko web adrese u Safari ili Chrome pregledaču. Pregled preuzetog HTML fajla može da onemogući interaktivni sadržaj.</div></noscript><div id="modal"></div>
<script>
var page='dashboard',view='owner',paid=false,confirmed=false,uploaded=false;
var houses=[{name:'Stan u centru',address:'Knez Mihailova 24, Beograd',tenant:'Ana Jovanović',rent:650,emoji:'🏢'},{name:'Porodični stan',address:'Bulevar oslobođenja 81, Novi Sad',tenant:'Marko Ilić',rent:720,emoji:'🏙️'},{name:'Garsonjera',address:'Niška 16, Niš',tenant:'Jelena Savić',rent:420,emoji:'🏠'}];
function heading(t,s,b){return '<div class="head"><div><h1>'+t+'</h1><p>'+s+'</p></div>'+(b||'')+'</div>'}
function stat(a,b,c){return '<div class="card"><div class="label">'+a+'</div><div class="value">'+b+'</div><div class="hint">'+c+'</div></div>'}
function prop(h){return '<article class="card property"><div class="art">'+h.emoji+'</div><div class="body"><h3>'+h.name+'</h3><p>'+h.address+'</p><div class="row"><span>'+h.tenant+'</span><b>€'+h.rent+' / mes.</b></div><button class="link" data-page="details">Pogledaj detalje →</button></div></article>'}
function dash(){return heading('Dobro jutro, Milane 👋','Pregled vaših nekretnina za novembar 2026.')+'<div class="grid stats">'+stat('Mesečni prihod','€1.790','3 aktivne nekretnine · +4,2%')+stat('Naplaćena kirija','€1.070','2 od 3 zakupca su platila')+stat('Na čekanju','€720','Dospelo 10. novembra')+stat('Upozorenja za račune','2 računa','Potrebna pažnja')+'</div><div class="grid cols"><section class="card"><h3 class="title">Prihod od kirije · EUR / RSD</h3><div style="font-size:23px;font-weight:bold">€1.790 <small class="muted">mesečno</small></div><div class="row">'+['Jun','Jul','Avg','Sep','Okt','Nov'].map(function(m,i){return '<span style="padding-top:'+(i%2?32:10)+'px;color:#617267">'+m+'<br><b style="color:#246b49">▂▅▆</b></span>'}).join('')+'</div></section><section class="card"><h3 class="title">Uplate na čekanju</h3><div class="line"><span>Marko Ilić<br><small class="muted">Kasni 6 dana</small></span><b>€720　<span class="tag bad">Kasni</span></b></div><div class="line"><span>Jelena Savić<br><small class="muted">Dospeva 1. dec</small></span><b>€420　<span class="tag">Uskoro</span></b></div><div class="line"><span>Ana Jovanović</span><b>€650　<span class="tag good">Plaćeno</span></b></div></section></div><h3 class="title" style="margin-top:24px">Moje nekretnine</h3><div class="grid props">'+houses.map(prop).join('')+'</div>'}
function properties(){return heading('Moje nekretnine','Upravljajte objektima, zakupcima i ugovorima.','<button class="btn" data-action="add">＋ Dodaj nekretninu</button>')+'<div class="grid props">'+houses.map(prop).join('')+'</div>'}
function details(){return heading('Detalji nekretnine','Stan u centru · Beograd','<button class="btn secondary" data-action="edit">Izmeni podatke</button>')+'<div class="grid cols"><section class="card"><div class="art">🏢</div><h2>Stan u centru</h2><p class="muted">Knez Mihailova 24, Beograd · Stan · 68 m²</p><div class="grid split"><div>Kirija<br><b>€650 mesečno</b></div><div>Dospeće<br><b>5. u mesecu</b></div><div>Status<br><b class="good">Aktivan zakup</b></div><div>Početak ugovora<br><b>1. mart 2025.</b></div></div></section><section class="card"><h3 class="title">Zakupac</h3><h3>Ana Jovanović</h3><p class="muted">Zakupac od marta 2025.</p><div class="warn" style="background:#eaf4ec;color:#205e40"><b>Godišnji prinos: 5,8%</b>Na osnovu procenjene vrednosti od €135.000</div><h3 class="title">Ugovor o zakupu</h3><div class="line">📄 Ugovor_o_zakupu_2025.pdf <button class="link" data-action="doc">Preuzmi</button></div></section><section class="card"><h3 class="title">Istorija kirije</h3><div class="line">Novembar 2026. <b>Primljeno · €650</b></div><div class="line">Oktobar 2026. <b>Primljeno · €650</b></div><div class="line">Septembar 2026. <b>Primljeno · €650</b></div></section></div>'}
function bills(){return heading('Kirija i računi','Novembar 2026. · Obaveze i status računa.')+'<div class="grid stats">'+stat('Kirija za mesec','€1.790','Od 3 zakupca')+stat('Primljena kirija','€1.070','2 potvrđene uplate')+stat('Ukupni računi','18.850 RSD','3 računa evidentirana')+stat('Preplata','620 RSD','Garsonjera · Toplana')+'</div><div class="warn"><b>⚠ Prethodni dug · Porodični stan</b>Račun za struju prikazuje prethodni dug od 3.840 RSD. Proverite sa zakupcem.</div><div class="alert"><b>✓ Prethodni dug izmiren · Stan u centru</b>Novi račun prikazuje 0 RSD prethodnog duga. Ranije obaveze su prema računu izmirene.</div><div class="grid split"><section class="card"><h3 class="title">Kirija</h3><div class="line">Ana Jovanović · €650 <button class="link" data-action="confirm">Potvrdi prijem</button></div><div class="line">Marko Ilić · €720 <span class="tag bad">Kasni</span></div><div class="line">Jelena Savić · €420 <span class="tag">Uskoro</span></div><p class="muted">Zakupac označava kao plaćeno, a vlasnik potvrđuje prijem novca.</p></section><section class="card"><h3 class="title">Računi za komunalije</h3><div class="line">⚡ Struja · Porodični stan <b>8.420 RSD<br><small class="muted">Prethodni dug: 3.840 RSD</small></b></div><div class="line">Infostan · Stan u centru <b>6.280 RSD<br><small class="muted">Prethodni dug: 0 RSD</small></b></div><div class="line">Toplana · Garsonjera <b>4.150 RSD<br><small class="muted">Preplata: 620 RSD</small></b></div></section></div><section class="card" style="margin-top:15px"><h3 class="title">Dodaj račun zakupca</h3><div class="upload"><p>'+ (uploaded?'Račun dodat — izdvojeni iznosi su simulirani':'Prevucite fotografiju ili PDF računa')+'</p><label for="billfile">Izaberi fotografiju ili PDF</label><input id="billfile" type="file" accept="image/*,.pdf"></div><p class="muted">OCR izdvajanje podataka je simulirano. IPS QR kod ne potvrđuje uplatu niti autentičnost računa.</p></section>'}
function tenant(){return heading('Zdravo, Ana 👋','Vaš portal za kiriju, račune i dokumenta.')+'<section class="card" style="background:#205e40;color:white"><small>VAŠ DOM</small><h2>Stan u centru</h2><p>Knez Mihailova 24, Beograd · Ugovor do 28. februara 2027.</p></section><div class="grid stats" style="margin-top:15px">'+stat('Mesečna kirija','€650','Dospeva 5. u mesecu')+stat('Status kirije',paid?'Prijavljeno':'Plaćeno',paid?'Čeka potvrdu vlasnika':'Novembar 2026.')+stat('Komunalije','6.280 RSD','Dospeva 18. novembra')+'</div><div class="grid split" style="margin-top:15px"><section class="card"><h3 class="title">Kirija za novembar</h3><div class="value">€650</div><p class="muted">Uplata na račun vlasnika · Rok 5. novembar</p><button class="btn" data-action="paid">'+(paid?'✓ Označeno kao plaćeno':'Označi kiriju kao plaćenu')+'</button><div class="line">Podsetnik za sledeću kiriju <b>1. decembar</b></div></section><section class="card"><h3 class="title">Dodaj račun za komunalije</h3><div class="upload"><p>'+ (uploaded?'Račun je dodat uspešno':'Pošaljite fotografiju ili PDF računa')+'</p><label for="tenantfile">Izaberi račun</label><input id="tenantfile" type="file" accept="image/*,.pdf"></div><p class="muted">Vlasnik dobija upozorenje ako račun prikaže prethodni dug.</p></section><section class="card"><h3 class="title">Prethodni računi</h3><div class="line">Elektrodistribucija · Oktobar <b>4.120 RSD · plaćeno</b></div><div class="line">Infostan · Oktobar <b>6.280 RSD · plaćeno</b></div></section><section class="card"><h3 class="title">Ugovor o zakupu</h3><div class="line">📄 Ugovor_o_zakupu_2025.pdf <button class="link" data-action="doc">Otvori</button></div></section></div>'}
function render(){document.querySelectorAll('[data-page]').forEach(function(b){b.classList.toggle('active',b.dataset.page===page)});document.querySelectorAll('[data-view]').forEach(function(b){b.classList.toggle('on',b.dataset.view===view)});document.getElementById('crumb').textContent=({dashboard:'Pregled',properties:'Moje nekretnine',details:'Detalji nekretnine',bills:'Kirija i računi',tenant:'Portal zakupca'})[page];document.getElementById('page').innerHTML=view==='tenant'?tenant():({dashboard:dash,properties:properties,details:details,bills:bills}[page]||dash)()}
function toast(t){var n=document.createElement('div');n.className='toast';n.textContent=t;document.body.appendChild(n);setTimeout(function(){n.remove()},2400)}
document.addEventListener('click',function(e){var b=e.target.closest('button');if(!b)return;if(b.dataset.page){page=b.dataset.page;view=page==='tenant'?'tenant':'owner';render();window.scrollTo(0,0)}if(b.dataset.view){view=b.dataset.view;page=view==='tenant'?'tenant':'dashboard';render()}if(b.dataset.action==='paid'){paid=true;render();toast('Vlasnik je obavešten o uplati.')}if(b.dataset.action==='confirm'){confirmed=true;toast('Prijem kirije je potvrđen.')}if(b.dataset.action==='doc')toast('Dokument je primer u prototipu.');if(b.dataset.action==='edit'||b.dataset.action==='add'){document.getElementById('modal').innerHTML='<div class="modalbg"><div class="modal"><h2>'+(b.dataset.action==='add'?'Dodaj nekretninu':'Izmeni podatke')+'</h2><label>Naziv</label><input id="f-name" placeholder="Naziv nekretnine"><label>Adresa</label><input id="f-address" placeholder="Adresa"><label>Zakupac</label><input id="f-tenant" placeholder="Ime i prezime"><label>Mesečna kirija</label><input id="f-rent" type="number" placeholder="650"><button class="btn" id="save">Sačuvaj</button> <button class="btn secondary" id="cancel">Otkaži</button></div></div>';document.getElementById('cancel').onclick=function(){document.getElementById('modal').innerHTML=''};document.getElementById('save').onclick=function(){var h={name:document.getElementById('f-name').value||'Nova nekretnina',address:document.getElementById('f-address').value||'Nova adresa, Srbija',tenant:document.getElementById('f-tenant').value||'Novi zakupac',rent:+document.getElementById('f-rent').value||500,emoji:'🏠'};if(b.dataset.action==='edit')houses[0]=h;else houses.push(h);page='properties';view='owner';render();toast('Podaci su sačuvani.');document.getElementById('modal').innerHTML=''}}});
document.addEventListener('change',function(e){if(e.target.type==='file'){uploaded=true;render();toast('Račun dodat. OCR podaci su demonstracioni.')}});render();
</script></body></html>
